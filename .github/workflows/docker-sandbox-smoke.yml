name: docker-sandbox-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/digitalbrain/execution/**'
      - 'tests/test_execution.py'
      - '.github/workflows/docker-sandbox-smoke.yml'

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Docker smoke
        run: |
          docker --version
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from digitalbrain.execution import ToolExecutor, ExecutionPolicy
          from digitalbrain.execution.tools import default_tools
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp); (root/'a.txt').write_text('x',encoding='utf-8')
              tools=default_tools(root)
              ex=ToolExecutor(workspace_root=root, policy=ExecutionPolicy(set(tools.keys()),allow_mutating=False), tools=tools, sandbox_mode='required')
              res=ex.execute('list_dir',{'path':'.'})
              assert res.ok, res
              print('ok')
          PY
